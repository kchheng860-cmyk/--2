<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kim Chheng</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: rgba(255,255,255,0.07);
      --gold: #e8c97a;
      --gold2: #f5dfa0;
      --white: #f0ede8;
      --muted: rgba(240,237,232,0.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(232,201,122,0.12), transparent 70%);
      top: -100px; left: -150px;
      animation: drift1 12s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(100,80,200,0.1), transparent 70%);
      bottom: -80px; right: -100px;
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(60px, 40px); } }
    @keyframes drift2 { to { transform: translate(-40px, -60px); } }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-wrap {
      position: relative;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.1s;
    }
    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #b8963c, var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px rgba(232,201,122,0.3), 0 8px 40px rgba(232,201,122,0.2);
    }
    .avatar-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid rgba(232,201,122,0.25);
      animation: spin 8s linear infinite;
    }
    .avatar-ring::before {
      content: '';
      position: absolute;
      top: 4px; left: 50%;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 8px var(--gold);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--gold2) 0%, var(--white) 60%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.25s;
    }
    .tagline {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.4s;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px 0 32px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.5s;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      opacity: 0;
    }
    .link-btn:nth-child(1) { animation: fadeUp 0.7s ease forwards 0.6s; }
    .link-btn:nth-child(2) { animation: fadeUp 0.7s ease forwards 0.75s; }
    .link-btn:nth-child(3) { animation: fadeUp 0.7s ease forwards 0.9s; }
    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .link-btn:hover { transform: translateY(-3px); }
    .link-btn:hover::before { opacity: 1; }
    .link-btn:active { transform: translateY(0px) scale(0.98); }
    .link-btn.facebook::before { background: linear-gradient(135deg, rgba(66,103,178,0.15), transparent); }
    .link-btn.facebook:hover { border-color: rgba(66,103,178,0.5); box-shadow: 0 8px 32px rgba(66,103,178,0.25); }
    .link-btn.telegram::before { background: linear-gradient(135deg, rgba(41,168,233,0.15), transparent); }
    .link-btn.telegram:hover { border-color: rgba(41,168,233,0.5); box-shadow: 0 8px 32px rgba(41,168,233,0.25); }
    .link-btn.tiktok::before { background: linear-gradient(135deg, rgba(255,0,79,0.12), transparent); }
    .link-btn.tiktok:hover { border-color: rgba(255,0,79,0.5); box-shadow: 0 8px 32px rgba(255,0,79,0.2); }
    .icon-wrap {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.3s;
    }
    .link-btn:hover .icon-wrap { background: rgba(255,255,255,0.1); }
    .link-text { flex: 1; }
    .link-name { display: block; font-size: 0.97rem; }
    .link-handle {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 300;
    }
    .arrow {
      font-size: 0.9rem;
      color: var(--muted);
      transition: transform 0.25s ease, color 0.25s ease;
    }
    .link-btn:hover .arrow { transform: translateX(4px); color: var(--white); }
    .qr-section {
      width: 100%;
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.05s;
    }
    .qr-label {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .qr-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .qr-card:hover {
      border-color: rgba(200,30,30,0.4);
      box-shadow: 0 8px 40px rgba(200,30,30,0.15);
    }
    .qr-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .aba-badge {
      background: linear-gradient(135deg, #cc1c1c, #e02020);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .qr-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.05em;
    }
    .qr-img-wrap {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .qr-img-wrap img {
      display: block;
      width: 230px;
      height: auto;
    }
    .qr-accounts {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qr-account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .qr-account-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .currency-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .currency-dot.khr { background: #e8c97a; }
    .currency-dot.usd { background: #5cb85c; }
    .qr-account-num {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.05em;
    }
    .scan-hint {
      font-size: 0.73rem;
      color: var(--muted);
      text-align: center;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .scan-hint::before, .scan-hint::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .footer {
      margin-top: 44px;
      font-size: 0.72rem;
      color: rgba(240,237,232,0.2);
      letter-spacing: 0.1em;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.1s;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
